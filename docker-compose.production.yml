services:
  app:
    image: ghcr.io/valtersystem/projeto_escala-api:${IMAGE_TAG:-latest}
    container_name: schedule_app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/secrets/schedule.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ${SCHEDULE_DATA_DIR:-/srv/volumes/schedule}/database.sqlite:/var/www/html/database/database.sqlite
      - ${SCHEDULE_DATA_DIR:-/srv/volumes/schedule}/storage:/var/www/html/storage
      - ${SCHEDULE_DATA_DIR:-/srv/volumes/schedule}/bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - internal

  web:
    image: ghcr.io/valtersystem/projeto_escala-web:${IMAGE_TAG:-latest}
    container_name: schedule_web
    restart: unless-stopped
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - proxy

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: proxy_default
