name: Publicar Schedule na VPS

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "docker/**"
      - "docker-compose.production.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: schedule-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://schedule.sevenfaithtech.com/

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/valtersystem/projeto_escala-api:${{ github.sha }}
            ghcr.io/valtersystem/projeto_escala-api:latest
          cache-from: type=gha,scope=schedule-api
          cache-to: type=gha,mode=max,scope=schedule-api

      - name: Construir e publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ghcr.io/valtersystem/projeto_escala-web:${{ github.sha }}
            ghcr.io/valtersystem/projeto_escala-web:latest
          cache-from: type=gha,scope=schedule-web
          cache-to: type=gha,mode=max,scope=schedule-web

      - name: Preparar acesso SSH restrito
        env:
          VPS_HOST_KEY: ${{ secrets.SCHEDULE_VPS_HOST_KEY }}
          VPS_SSH_KEY_BASE64: ${{ secrets.SCHEDULE_VPS_SSH_KEY_BASE64 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/schedule_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/schedule_deploy ~/.ssh/known_hosts

      - name: Publicar commit na VPS
        env:
          VPS_HOST: ${{ secrets.SCHEDULE_VPS_HOST }}
        run: |
          ssh \
            -i ~/.ssh/schedule_deploy \
            -o BatchMode=yes \
            "schedule-deploy@$VPS_HOST" \
            "deploy $GITHUB_SHA"
