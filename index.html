<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Protótipo de validação do app de escalas de ministérios — voluntário, líder e administração.">
<meta name="theme-color" content="#4A3C8C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0D18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escala">
<link rel="manifest" href='data:application/manifest+json,{"name":"Escala do Minist%C3%A9rio","short_name":"Escala","start_url":"./","display":"standalone","background_color":"%23F4F3F8","theme_color":"%234A3C8C","orientation":"portrait"}'>
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui;background:#F4F3F8}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Escala do Ministério</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --surface-2:#EFEDF5; --line:#E2DFEC; --line-2:#CFC9E0;
  --ink:#191527; --ink-2:#4B4562; --ink-3:#7C7594;
  --brand:#4A3C8C; --on-brand:#FFFFFF; --brand-soft:#ECE8FA; --brand-line:#CFC5F0;
  --ok:#1D7A4E; --ok-soft:#E1F2E9; --ok-line:#B9DDCA;
  --warn:#8F6203; --warn-soft:#FAF0D9; --warn-line:#E7D19A;
  --crit:#AF3122; --crit-soft:#FBE7E3; --crit-line:#EFC2BA;
  --shadow-1:0 1px 2px rgba(25,21,39,.06);
  --shadow-2:0 2px 4px rgba(25,21,39,.05), 0 14px 34px -18px rgba(25,21,39,.35);
  --shadow-3:0 -8px 40px -12px rgba(25,21,39,.28);
  --r-m:14px; --r-l:20px;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --ui:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D18; --surface:#191627; --surface-2:#221D36; --line:#2E2944; --line-2:#413A5E;
    --ink:#EFECF8; --ink-2:#BAB4CE; --ink-3:#8C85A6;
    --brand:#A899F5; --on-brand:#17122B; --brand-soft:#262046; --brand-line:#3D3566;
    --ok:#63CD97; --ok-soft:#152E20; --ok-line:#23492F;
    --warn:#E2B65C; --warn-soft:#2F2510; --warn-line:#4C3C17;
    --crit:#F28C7D; --crit-soft:#341A17; --crit-line:#552923;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.8);
    --shadow-3:0 -8px 40px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D18; --surface:#191627; --surface-2:#221D36; --line:#2E2944; --line-2:#413A5E;
  --ink:#EFECF8; --ink-2:#BAB4CE; --ink-3:#8C85A6;
  --brand:#A899F5; --on-brand:#17122B; --brand-soft:#262046; --brand-line:#3D3566;
  --ok:#63CD97; --ok-soft:#152E20; --ok-line:#23492F;
  --warn:#E2B65C; --warn-soft:#2F2510; --warn-line:#4C3C17;
  --crit:#F28C7D; --crit-soft:#341A17; --crit-line:#552923;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.8);
  --shadow-3:0 -8px 40px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
@media (min-width:900px){
  body{background:radial-gradient(130% 100% at 50% -10%, var(--surface-2) 0%, var(--bg) 55%) fixed}
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;text-align:left}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.stage{display:flex;justify-content:center}
@media (min-width:900px){.stage{min-height:100vh;align-items:center;padding:30px 20px}}
.bezel{position:relative;width:100%}
@media (min-width:900px){
  .bezel{width:393px;padding:11px;border-radius:57px;
    background:linear-gradient(155deg,#3a3a44 0%,#141419 26%,#0d0d11 60%,#33333c 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.07) inset, 0 2px 3px rgba(255,255,255,.12) inset,
               0 42px 70px -34px rgba(10,8,20,.65), 0 14px 32px -18px rgba(10,8,20,.5)}
}
.device{position:relative;width:100%;max-width:430px;margin:0 auto;background:var(--surface);
  display:flex;flex-direction:column;height:100svh;min-height:100svh;overflow:hidden}
@media (min-width:900px){
  .device{width:371px;max-width:none;height:min(804px,calc(100vh - 86px));min-height:0;border-radius:46px}
}
.island,.home{display:none}
@media (min-width:900px){
  .island{display:block;position:absolute;top:23px;left:50%;transform:translateX(-50%);
    width:104px;height:31px;border-radius:20px;background:#07070b;z-index:40;pointer-events:none}
  .home{display:block;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;z-index:40;pointer-events:none}
}
.statusbar{display:none}
@media (min-width:900px){
  .statusbar{display:flex;justify-content:space-between;align-items:center;flex:none;
    height:52px;padding:8px 26px 0 30px;background:var(--surface);
    font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .statusbar .icons{display:flex;align-items:center;gap:6px;color:var(--ink)}
}
.appbar{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
@media (min-width:900px){.appbar{padding-top:6px}}
.mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none}
.appbar h1{margin:0;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.appbar .sub{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.persona{padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.persona .hint{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:0 4px 6px}
.persona .hint i{width:5px;height:5px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);
  text-align:center;transition:background .16s,color .16s,box-shadow .16s}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-1)}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));position:relative}
.screen{display:flex;flex-direction:column;gap:14px}
.greet{margin:2px 4px 0}
.greet h2{margin:0;font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.greet p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-size:13.5px;font-weight:600;margin:0 4px}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 4px -4px}
.eyebrow span{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow button{font-size:12.5px;font-weight:600;color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-1)}
.card.pad{padding:15px}
.card.flat{box-shadow:none}
.callout{border-radius:var(--r-l);overflow:hidden;border:1px solid var(--brand-line);box-shadow:var(--shadow-2)}
.callout .top{background:var(--brand);color:var(--on-brand);padding:15px 16px}
.callout .top .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.callout .top h3{margin:5px 0 0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.callout .top p{margin:6px 0 0;font-size:13px;opacity:.9;line-height:1.4}
.callout .body{padding:14px 16px 16px;background:var(--surface)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;color:var(--ink)}
.actions{display:flex;gap:9px;margin-top:15px}
.btn{min-height:46px;border-radius:12px;font-weight:600;font-size:14.5px;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;padding:0 16px;transition:transform .1s;text-align:center}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);color:var(--on-brand);flex:1}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);flex:1}
.btn.soft{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);flex:1}
.btn.danger{background:var(--surface);border:1px solid var(--crit-line);color:var(--crit);flex:1}
.btn.wide{width:100%}
.btn.sm{min-height:38px;font-size:13px;padding:0 13px;border-radius:10px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;
  font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.pill.mut{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:none}
.row .date{width:44px;flex:none;text-align:center;font-family:var(--mono)}
.row .date span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.row .date b{display:block;font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.row .main{flex:1;min-width:0}
.row .main strong{display:block;font-size:14.5px;font-weight:600}
.row .main small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.row .rail{width:3px;align-self:stretch;border-radius:3px;flex:none;margin:-2px 0}
.chev{color:var(--ink-3);flex:none;transform:scaleX(-1)}
.ini{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line)}
.ini.mut{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.ini.sm{width:26px;height:26px;font-size:10px}
.stack{display:flex;flex:none;gap:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px}
.stat b{display:block;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.posto{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1)}
.posto>header{padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:10px}
.posto>header .t{flex:1;min-width:0}
.posto>header strong{display:block;font-size:14px;font-weight:700;line-height:1.3;text-wrap:balance}
.posto>header small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.turno{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);width:100%}
.turno:last-child{border-bottom:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;
  color:transparent;transition:background .14s,border-color .14s}
[aria-pressed="true"]>.box{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.turno .t{flex:1;min-width:0}
.turno .t strong{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.turno .t small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.turno.cheio{opacity:.5}
.vagas{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap;flex:none;text-align:right;
  text-transform:uppercase;letter-spacing:.06em}
.vagas b{display:block;font-size:14px;color:var(--ink-2);letter-spacing:0}
.sticky{position:sticky;bottom:0;margin:6px -14px calc(-20px - env(safe-area-inset-bottom));
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:var(--surface);
  border-top:1px solid var(--line);box-shadow:var(--shadow-3);z-index:5}
.sticky .lbl{font-size:12px;color:var(--ink-3);margin-bottom:9px;display:flex;justify-content:space-between;gap:10px}
.orient{font-size:13px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
details.card{padding:0}
details.card>summary{padding:13px 15px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-family:var(--mono);color:var(--ink-3);font-size:17px}
details.card[open]>summary::after{content:"–"}
details.card>div{padding:0 15px 15px}
.prog{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:4px}
.prog i.pend{background:var(--warn)}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:10px;padding:7px 0;width:100%}
.bar .nm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.bar .vl{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar[aria-current="true"] .nm,.bar[aria-current="true"] .vl{color:var(--ink);font-weight:600}
.readout{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);min-height:20px}
.readout b{color:var(--ink)}
.alert{display:flex;gap:10px;padding:12px 13px;border-radius:var(--r-m);font-size:13px;line-height:1.4;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.alert.crit{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit-line)}
.alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.alert.info{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line)}
.alert b{display:block;font-weight:700;margin-bottom:1px}
.alert svg{flex:none;margin-top:1px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 4px 4px;margin:0 -4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;min-height:34px;text-align:center}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.track{width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .18s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);transition:transform .18s}
[aria-pressed="true"]>.track{background:var(--brand)}
[aria-pressed="true"]>.track::after{transform:translateX(18px)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:0 4px}
.field{padding:10px 14px;border-bottom:1px solid var(--line);position:relative}
.field:last-child{border-bottom:none}
.field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;border:none;background:none;font:inherit;
  color:var(--ink);outline:none;resize:vertical;min-height:26px;padding:0}
.field select{appearance:none;-webkit-appearance:none;padding-right:18px}
.field.sel::after{content:"";position:absolute;right:16px;bottom:19px;width:7px;height:7px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);pointer-events:none}
.field input::placeholder,.field textarea::placeholder{color:var(--line-2)}
.duo{display:grid;grid-template-columns:1fr 1fr}
.duo .field{border-right:1px solid var(--line)}
.duo .field:last-child{border-right:none}
.json{font-family:var(--mono);font-size:10.5px;line-height:1.5;min-height:120px}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex:none}
@media (min-width:900px){.tabbar{padding-bottom:22px}.toast{bottom:98px}.sheet{padding-bottom:22px}}
.tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:9.5px;font-weight:600;color:var(--ink-3);position:relative;text-align:center;padding:0 2px}
.tabbar button[aria-selected="true"]{color:var(--brand)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:8px;
  background:var(--crit);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(15,13,24,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-3);transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:21;
  max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line-2);margin:9px auto 4px;flex:none}
.sheet h3{margin:6px 18px 2px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sheet .cap{margin:0 18px 10px;font-size:12.5px;color:var(--ink-3)}
.sheet .scroll{overflow-y:auto;padding:0 0 12px}

<script>
(function(){
"use strict";

/* ============ armazenamento ============ */
var KEY="escala.proto.v2";
var DB=vazio();
function vazio(){
  return {ministerios:[],postos:[],escalas:[],turnos:[],pessoas:[],disp:{},conf:{},
          cultos:[],funcoes:[],func:{},trocas:[],avisos:[],bandas:[],
          eu:{minLider:null,voluntario:null},cfg:{limite:3,prazoDias:5,orientacoes:""}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function seedCultos(d){
  GRADE_PADRAO.forEach(function(o){
    d.cultos.push({id:uid(),nome:o.nome,tipo:o.tipo,dia:o.dia,ordem:o.ordem||1,ini:o.ini,fim:o.fim});
  });
  return d;
}
function novoDB(){return seedCultos(vazio());}
/* dados de exemplo para o teste: entram só na primeira abertura (sem dados salvos) */
function dadosExemplo(){
  var d=seedCultos(vazio());
  d.ministerios=[
    {id:"m1",nome:"Mídia",liderId:"p1"},
    {id:"m2",nome:"Louvor",liderId:"p4"},
    {id:"m3",nome:"Recepção",liderId:"p7"}];
  d.bandas=[
    {id:"b1",minId:"m2",nome:"Banda 1"},
    {id:"b2",minId:"m2",nome:"Banda 2"},
    {id:"b3",minId:"m2",nome:"Banda 3"}];
  d.postos=[
    {id:"po1",minId:"m1",nome:"Câmera",desc:"",vagas:2},
    {id:"po2",minId:"m2",nome:"Som",desc:"",vagas:2},
    {id:"po3",minId:"m3",nome:"Porta",desc:"",vagas:2}];
  /* Louvor: 16 pessoas, cada uma fixa em uma banda */
  var louvor=[
    ["p4","Marcos Reis"],["p5","Lucas Tavares"],["p2","Bruno Souza"],["p14","Diego Almeida"],["p15","Ester Moura"],
    ["p6","Helena Costa"],["p10","Rafael Mota"],["p16","Igor Barros"],["p17","Sofia Ribeiro"],["p18","Felipe Carvalho"],
    ["p1","Ana Lima"],["p11","Fernanda Luz"],["p12","Thiago Nunes"],["p13","Camila Rocha"],["p19","Gabriel Freitas"],["p20","Bianca Lopes"]];
  var outros=[
    {id:"p3",nome:"Carla Dias",minIds:["m1"],postoIds:["po1"]},
    {id:"p7",nome:"Juliana Prado",minIds:["m3"],postoIds:["po3"]},
    {id:"p8",nome:"Pedro Alves",minIds:["m3"],postoIds:["po3"]},
    {id:"p9",nome:"Renata Lima",minIds:["m3"],postoIds:["po3"]}];
  d.pessoas=louvor.map(function(x){
    var mids=["m2"],pids=["po2"];
    if(x[0]==="p1"||x[0]==="p2"||x[0]==="p10"){mids=["m1","m2"];pids=["po1","po2"];}
    return {id:x[0],nome:x[1],tel:"",adm:x[0]==="p1",minIds:mids,postoIds:pids,ativo:true};
  }).concat(outros.map(function(o){return {id:o.id,nome:o.nome,tel:"",adm:false,minIds:o.minIds,postoIds:o.postoIds,ativo:true};}));
  d.funcoes=[
    {id:"f1",minId:"m2",nome:"Voz"},
    {id:"f2",minId:"m2",nome:"Guitarra"},
    {id:"f3",minId:"m2",nome:"Bateria"},
    {id:"f4",minId:"m2",nome:"Baixo"},
    {id:"f5",minId:"m2",nome:"Teclado"}];
  d.escalas=[
    {id:"e1",minId:"m1",mes:"2026-11",prazo:"2026-11-01",status:"publicada"},
    {id:"e2",minId:"m2",mes:"2026-11",prazo:"2026-11-01",status:"publicada"},
    {id:"e3",minId:"m3",mes:"2026-11",prazo:"2026-11-01",status:"aberta"},
    {id:"e4",minId:"m1",mes:"2026-12",prazo:"2026-11-25",status:"aberta"},
    {id:"e5",minId:"m2",mes:"2026-12",prazo:"2026-11-25",status:"aberta"},
    {id:"e6",minId:"m2",mes:"2027-01",prazo:"2026-12-20",status:"rascunho"}];
  d.turnos=[
    {id:"t1",escalaId:"e1",postoId:"po1",data:"2026-11-08",ini:"08h00",fim:"11h30",vagas:2,cultoId:null,cultoNome:""},
    {id:"t3",escalaId:"e3",postoId:"po3",data:"2026-11-08",ini:"08h00",fim:"11h30",vagas:2,cultoId:null,cultoNome:""},
    {id:"t4",escalaId:"e1",postoId:"po1",data:"2026-11-15",ini:"08h00",fim:"11h30",vagas:2,cultoId:null,cultoNome:""},
    {id:"t5",escalaId:"e4",postoId:"po1",data:"2026-12-06",ini:"08h00",fim:"11h30",vagas:2,cultoId:null,cultoNome:""}];
  /* Louvor: Manhã e Noite de cada domingo, banda pelo rodízio contínuo (1, 2, 3, 1, ...) */
  var domingos={e2:["2026-11-01","2026-11-08","2026-11-15","2026-11-22","2026-11-29"],
                e5:["2026-12-06","2026-12-13","2026-12-20","2026-12-27"],
                e6:["2027-01-03","2027-01-10","2027-01-17","2027-01-24","2027-01-31"]};
  var BANDAS=["b1","b2","b3"],k=0;
  ["e2","e5","e6"].forEach(function(eid){
    domingos[eid].forEach(function(dt){
      [["08h00","11h30"],["19h00","21h00"]].forEach(function(h){
        d.turnos.push({id:"lv"+k,escalaId:eid,postoId:"po2",data:dt,ini:h[0],fim:h[1],vagas:2,bandaId:BANDAS[k%3],cultoId:null,cultoNome:""});
        k++;
      });
    });
  });
  /* membros fixos de cada banda */
  var fixos={b1:["p4","p5","p2","p14","p15"],b2:["p6","p10","p16","p17","p18"],b3:["p1","p11","p12","p13","p19","p20"]};
  /* o que cada pessoa já faz */
  var sabe={p4:["f1"],p5:["f2","f4"],p2:["f2"],p14:["f3"],p15:["f5","f1"],p6:["f1"],p10:["f3"],p16:["f4"],p17:["f1"],p18:["f2"],p1:["f1"],p11:["f4"],p12:["f3"],p13:["f5","f1"],p19:["f2"],p20:["f1"]};
  d.pessoas.forEach(function(p){
    p.bandaIds=Object.keys(fixos).filter(function(b){return fixos[b].indexOf(p.id)>=0;});
    p.funcaoIds=sabe[p.id]||[];
  });
  /* novembro (publicada): os dois primeiros membros de cada banda estão confirmados */
  d.conf={t1:["p1","p3"],t4:["p2"],t3:["p9"]};
  d.func={};
  for(var n=0;n<10;n++){
    var tn=d.turnos.filter(function(t){return t.id==="lv"+n;})[0];
    var mem=fixos[tn.bandaId].slice(0,2);
    d.conf["lv"+n]=mem;
    d.func["lv"+n]={};
    mem.forEach(function(pid){d.func["lv"+n][pid]=[sabe[pid][0]];});
  }
  /* exemplo: a Ana (Banda 3) toca na Banda 1 no domingo 08/11 à noite, junto com o Bruno */
  d.conf.lv3=["p1","p2"];
  d.func.lv3={p1:["f1"],p2:["f2"]};
  /* dezembro (aberta): cada banda marca os próprios turnos; a Ana marca um turno da Banda 2 */
  d.disp={};
  for(var m=10;m<18;m++){
    var tm=d.turnos.filter(function(t){return t.id==="lv"+m;})[0];
    d.disp["lv"+m]=fixos[tm.bandaId].slice();
  }
  d.disp.lv10.push("p1");
  d.eu={minLider:"p1",voluntario:"p10"};
  return d;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r); if(o&&o.pessoas){DB=migra(Object.assign(vazio(),o));return;}}
  }catch(e){}
  DB=dadosExemplo(); save();
}
function migra(d){
  d.pessoas.forEach(function(p){
    if(p.adm===undefined)p.adm=(p.papel==="adm");
    if(!Array.isArray(p.minIds))p.minIds=[];
    if(!Array.isArray(p.postoIds))p.postoIds=[];
    if(p.ativo===undefined)p.ativo=true;
    delete p.papel;
  });
  if(!Array.isArray(d.cultos))d.cultos=[];
  if(!Array.isArray(d.bandas))d.bandas=[];
  if(!Array.isArray(d.funcoes))d.funcoes=[];
  if(!d.func||typeof d.func!=="object")d.func={};
  d.pessoas.forEach(function(p){if(!Array.isArray(p.funcaoIds))p.funcaoIds=[];if(!Array.isArray(p.bandaIds))p.bandaIds=[];});
  if(!d.eu)d.eu={minLider:null,voluntario:null};
  if(d.eu.minLider===undefined){
    var alvo=null;
    d.ministerios.forEach(function(m){if(m.liderId===d.eu.lider&&!alvo)alvo=m;});
    d.eu={minLider:alvo?alvo.id:null,voluntario:d.eu.voluntario||null};
  }
  return d;
}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ============ utilidades ============ */
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var SEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function hoje(){return new Date();}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dia(d){var x=new Date(d+"T12:00:00");return {n:String(x.getDate()).padStart(2,"0"),sem:SEM[x.getDay()],mes:MESES[x.getMonth()],ord:x.getTime()};}
function fmtMes(ym){var p=ym.split("-");return MESES[+p[1]-1]+" de "+p[0];}
function fmtData(d){var x=dia(d);return x.n+" de "+x.mes;}
function ymDe(d){return d.slice(0,7);}
function shiftMes(ym,k){var p=ym.split("-");var d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function isoYMD(y,mo,d){return y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function grade(ym){var p=ym.split("-"),y=+p[0],mo=+p[1]-1;
  return {y:y,mo:mo,start:new Date(y,mo,1).getDay(),n:new Date(y,mo+1,0).getDate()};}
function ini(n){var p=(n||"?").trim().split(/\s+/);return ((p[0][0]||"")+(p[1]?p[1][0]:"")).toUpperCase();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function by(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function pessoa(id){return by(DB.pessoas,id);}
function nomeDe(id){var p=pessoa(id);return p?p.nome:"—";}
function primeiro(id){return nomeDe(id).split(" ")[0];}
function postosDo(minId){return DB.postos.filter(function(p){return p.minId===minId;});}
/* bandas são grupos dentro de um ministério (ex.: Louvor), cada uma com escala própria */
function bandasDo(minId){return DB.bandas.filter(function(b){return b.minId===minId;});}
function nomeBanda(id){var b=by(DB.bandas,id);return b?b.nome:"";}
function rotuloEscala(e){return fmtMes(e.mes);}
/* rodízio: cada turno recebe a próxima banda, em sequência contínua entre meses */
function rodizioBandas(minId,plano){
  var bs=bandasDo(minId);
  if(!bs.length||!plano.length)return;
  plano.sort(function(a,b){return (a.data+a.ini)<(b.data+b.ini)?-1:1;});
  var ini0=plano[0].data+plano[0].ini,ultimo=null;
  DB.turnos.forEach(function(t){
    var em=by(DB.escalas,t.escalaId);
    if(!t.bandaId||!em||em.minId!==minId)return;
    if(t.data+t.ini<ini0&&(!ultimo||t.data+t.ini>ultimo.data+ultimo.ini))ultimo=t;
  });
  var ids=bs.map(function(b){return b.id;});
  var i0=ultimo?(ids.indexOf(ultimo.bandaId)+1)%ids.length:0;
  plano.forEach(function(t,k){t.bandaId=ids[(i0+k)%ids.length];});
}
function turnosDa(escId){return DB.turnos.filter(function(t){return t.escalaId===escId;}).sort(function(a,b){return dia(a.data).ord-dia(b.data).ord;});}
function escalasDo(minId){return DB.escalas.filter(function(e){return e.minId===minId;}).sort(function(a,b){return a.mes<b.mes?1:-1;});}
function equipeDe(minId){return DB.pessoas.filter(function(p){return p.minIds.indexOf(minId)>=0;});}
function lideraDe(pid){return DB.ministerios.filter(function(m){return m.liderId===pid;});}
function serveEm(p){return p.minIds.map(function(id){return by(DB.ministerios,id);}).filter(Boolean);}
function rotulos(p){
  var out=[];
  if(p.adm)out.push({t:"Adm",k:"brand"});
  lideraDe(p.id).forEach(function(m){out.push({t:"Líder · "+m.nome,k:"brand"});});
  serveEm(p).forEach(function(m){if(m.liderId!==p.id)out.push({t:m.nome,k:"mut"});});
  return out;
}
function hm(txt){
  var m=String(txt||"").replace(",",".").match(/(\d{1,2})\s*[h:.]?\s*(\d{2})?/);
  if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0;
  if(h>23||mi>59)return null;
  return h*60+mi;
}
function faixa(t){var a=hm(t.ini),b=hm(t.fim);if(a==null)return null;if(b==null||b<=a)b=a+60;return [a,b];}
function choca(t1,t2){
  if(t1.data!==t2.data)return false;
  var a=faixa(t1),b=faixa(t2);
  if(!a||!b)return true;
  return a[0]<b[1]&&b[0]<a[1];
}
function turnosFirmes(pid){
  return DB.turnos.filter(function(t){
    if(conf(t.id).indexOf(pid)<0)return false;
    var e=by(DB.escalas,t.escalaId);
    return e&&e.status!=="rascunho";
  });
}
function conflitosDe(pid,turno){
  return turnosFirmes(pid).filter(function(t){return t.id!==turno.id&&choca(turno,t);});
}
function mesmoDiaDe(pid,turno){
  return turnosFirmes(pid).filter(function(t){return t.id!==turno.id&&t.data===turno.data&&!choca(turno,t);});
}
/* turnos que o voluntário já marcou (disponível) em escalas abertas */
function marcadosDe(pid){
  return DB.turnos.filter(function(t){
    var e=by(DB.escalas,t.escalaId);
    return e&&e.status==="aberta"&&disp(t.id).indexOf(pid)>=0;
  });
}
/* choques do voluntário: com turnos confirmados e com os que ele já marcou */
function choquesDe(pid,turno){
  return conflitosDe(pid,turno).concat(marcadosDe(pid).filter(function(t){
    return t.id!==turno.id&&choca(turno,t);
  }));
}
var DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
var ORD={1:"1ª",2:"2ª",3:"3ª",4:"4ª",5:"5ª","-1":"última"};
function rotuloCulto(c){
  var art=(c.dia===0||c.dia===6)?"Todo":"Toda";
  return c.tipo==="mensal"
    ? (ORD[c.ordem]||"1ª")+" "+DIAS[c.dia]+" do mês"
    : art+" "+DIAS[c.dia];
}
function ocorrencias(c,ym){
  var g=grade(ym),out=[],n=0,d;
  for(d=1;d<=g.n;d++){
    if(new Date(g.y,g.mo,d).getDay()!==c.dia)continue;
    if(c.tipo!=="mensal"){out.push(isoYMD(g.y,g.mo,d));continue;}
    n++;
    if(+c.ordem===n)out.push(isoYMD(g.y,g.mo,d));
  }
  if(c.tipo==="mensal"&&+c.ordem===-1){
    out=[];var ult=null;
    for(d=1;d<=g.n;d++)if(new Date(g.y,g.mo,d).getDay()===c.dia)ult=isoYMD(g.y,g.mo,d);
    if(ult)out=[ult];
  }
  return out;
}
function proximasDatas(c,qtd){
  var out=[],ym=ymDe(iso(hoje())),hj=iso(hoje());
  for(var k=0;k<4&&out.length<qtd;k++){
    ocorrencias(c,ym).forEach(function(d){if(d>=hj&&out.length<qtd)out.push(d);});
    ym=shiftMes(ym,1);
  }
  return out;
}
function nomeCulto(t){
  if(t.cultoNome)return t.cultoNome;
  var c=t.cultoId&&by(DB.cultos,t.cultoId);

}
function descreveTurno(t){
  var po=by(DB.postos,t.postoId),m=minDoTurno(t);
  return (m?m.nome+" · ":"")+(po?po.nome:"turno")+" "+t.ini+"–"+t.fim;
}
function funcoesDe(minId){return DB.funcoes.filter(function(x){return x.minId===minId;});}
function nomeFunc(id){var f=by(DB.funcoes,id);return f?f.nome:"";}
function funcsDo(tid,pid){var m=DB.func[tid];return (m&&Array.isArray(m[pid]))?m[pid]:[];}
function setFuncs(tid,pid,ids){
  if(!DB.func[tid])DB.func[tid]={};
  if(ids&&ids.length)DB.func[tid][pid]=ids; else delete DB.func[tid][pid];
  if(DB.func[tid]&&!Object.keys(DB.func[tid]).length)delete DB.func[tid];
}
function rotuloFuncs(tid,pid){return funcsDo(tid,pid).map(nomeFunc).filter(Boolean).join(" · ");}
function tituloTurno(t){
  var c=nomeCulto(t),po=by(DB.postos,t.postoId);

}
function disp(id){return DB.disp[id]||[];}

function minDoTurno(t){var e=by(DB.escalas,t.escalaId);return e?by(DB.ministerios,e.minId):null;}
function avisar(para,txt){if(para)DB.avisos.push({id:uid(),para:para,txt:txt,lido:false,quando:Date.now()});}
function avisosDe(pid){return DB.avisos.filter(function(a){return a.para===pid&&!a.lido;});}
function trocaDo(turnoId,pid){
  return DB.trocas.filter(function(x){return x.turnoId===turnoId&&x.estado==="aberto"&&(!pid||x.de===pid);})[0]||null;
}
function trocasAbertas(minId){

    if(x.estado!=="aberto")return false;

  });

}

        '<small>'+esc(descreveTurno(z.a))+'</small>'+
        '<small>'+esc(descreveTurno(z.b))+'</small></div>'+
        '<span class="pill crit"><i></i>Choque</span></div>';
    });
    h+='</div>';

  var semLider=DB.ministerios.filter(function(m){return !m.liderId;});
  if(semLider.length){
    h+='<div class="alert warn">'+svg("users",18)+'<div><b>'+semLider.length+' ministério(s) sem líder</b>'+
      esc(semLider.map(function(m){return m.nome;}).join(", "))+' — ninguém pode abrir a escala.</div></div>';

function candidatos(t,excluir){
  var m=minDoTurno(t); if(!m)return [];
  var c=conf(t.id);
  return equipeDe(m.id).filter(function(p){
    return p.ativo&&p.id!==excluir&&c.indexOf(p.id)<0&&
      (!p.postoIds.length||p.postoIds.indexOf(t.postoId)>=0);
  }).map(function(p){
    return {p:p,marcou:disp(t.id).indexOf(p.id)>=0,carga:turnosFirmes(p.id).length,fora:foraDaBanda(p.id,t)};
  }).sort(function(a,b){return (a.fora-b.fora)||(b.marcou-a.marcou)||(a.carga-b.carga);});
}
/* banda é fixa: quem não é membro dela só entra no turno pedindo ao líder */
function foraDaBanda(pid,turno){
  if(!turno.bandaId)return false;
  var p=pessoa(pid);
  return !!p&&(p.bandaIds||[]).indexOf(turno.bandaId)<0;
}

  lista.forEach(function(e){

      '<div class="when">'+esc(rotuloEscala(e))+'</div>'+
      '<h3>'+(e.status==="rascunho"?ts.length+" turno(s) no rascunho"
             :e.status==="aberta"?Object.keys(marcaram).length+" de "+eq+" já responderam"
             :c+" de "+vagas+" vagas preenchidas")+'</h3>'+
      '<p>'+(e.status==="rascunho"?"Monte os turnos e libere para a equipe marcar."
            :e.status==="aberta"?"Prazo para responder: "+(e.prazo?fmtData(e.prazo):"sem prazo")+"."
            :"Publicada — cada pessoa recebeu os turnos dela.")+'</p></div>'+

      (e.status==="rascunho"?"Montar turnos":e.status==="aberta"?"Montar escala":"Ver escala")+'</button></div>'+
      '</div></article>';
  });
  h+='<button class="btn soft wide" data-act="nova-escala">'+svg("plus",18)+'Abrir escala de outro mês</button>';
  return h;

      '</small></span>'+

function liderRel(){
  var m=meuMin(); if(!m)return semLiderBox();
  var eq=equipeDe(m.id),ts=[];
  escalasDo(m.id).forEach(function(e){ts=ts.concat(turnosDa(e.id));});
  var h=trocaLider(m)+'<div class="greet"><h2>Relatório</h2><p>'+esc(m.nome)+' · só o seu ministério</p></div>';
  if(!ts.length||!eq.length){
    h+=vazioBox("chart","Sem dados ainda",
      "O relatório aparece quando houver equipe cadastrada e turnos na escala.");
    return h;
  }
  var vagas=ts.reduce(function(a,t){return a+t.vagas;},0);
  var cheias=ts.reduce(function(a,t){return a+Math.min(conf(t.id).length,t.vagas);},0);
  var vazios=ts.filter(function(t){return disp(t.id).length===0;}).length;
  var dados=eq.map(function(p){
    var n=0;ts.forEach(function(t){if(conf(t.id).indexOf(p.id)>=0)n++;});
    return {n:p.nome.split(" ")[0],v:n};
  }).sort(function(a,b){return b.v-a.v;});
  var max=Math.max(1,dados[0].v,DB.cfg.limite);
  var sel=dados[S.barSel]||dados[0];
  h+='<div class="stats">'+
    '<div class="stat"><b>'+(vagas?Math.round(cheias/vagas*100):0)+'%</b><span>vagas preenchidas</span></div>'+
    '<div class="stat"><b>'+vazios+'</b><span>turnos sem ninguém</span></div>'+
    '<div class="stat"><b>'+eq.filter(function(p){return p.ativo;}).length+'</b><span>voluntários ativos</span></div></div>';
  h+='<div class="eyebrow"><span>Turnos por pessoa</span></div>';
  h+='<article class="card pad"><div class="bars">';
  dados.forEach(function(d,i){
    h+='<button class="bar" data-act="bar" data-i="'+i+'" aria-current="'+(i===S.barSel)+'">'+
      '<span class="nm">'+esc(d.n)+'</span><span class="tr"><i style="width:'+(d.v/max*100)+'%"></i></span>'+
      '<span class="vl">'+d.v+'</span></button>';
  });
  h+='</div><div class="readout"><b>'+esc(sel.n)+'</b> está em '+sel.v+' turno(s)'+
     (sel.v>DB.cfg.limite?" — acima do limite de "+DB.cfg.limite:(sel.v===0?" — ainda não entrou em nenhum":""))+'.</div></article>';
  var criticos=ts.filter(function(t){return disp(t.id).length===0;});
  if(criticos.length){
    h+='<div class="eyebrow"><span>Onde aperta</span></div><div class="card list">';
    criticos.slice(0,5).forEach(function(t){
      var p=by(DB.postos,t.postoId),d=dia(t.data);
      h+='<div class="row"><span class="rail" style="background:var(--crit)"></span>'+
        '<div class="main"><strong>'+(p?esc(p.nome):"posto removido")+' · '+d.n+"/"+t.data.split("-")[1]+'</strong>'+
        '<small>ninguém marcou disponibilidade</small></div><span class="pill crit"><i></i>Vazio</span></div>';
    });
    h+='</div>';
  }
  return h;
}

/* ============ VOLUNTÁRIO ============ */
function euVol(){
  var p=DB.eu.voluntario&&pessoa(DB.eu.voluntario);
  if(p&&p.minIds.length)return p;
  var v0=DB.pessoas.filter(function(x){return x.minIds.length;});
  if(v0.length){DB.eu.voluntario=v0[0].id;return v0[0];}
  return null;
}
function semVolBox(){
  return '<div class="greet"><h2>Voluntário</h2><p>Nenhum voluntário cadastrado</p></div>'+
    vazioBox("user","Sem voluntário para simular",
      "No perfil <b>Líder</b>, aba Equipe, cadastre um voluntário. Depois volte aqui para ver o app pelos olhos dele.",
      '<button class="btn primary" data-act="ir-equipe">Ir para Equipe</button>');
}
function trocaVol(p){
  var vs=DB.pessoas.filter(function(x){return x.minIds.length;});
  if(vs.length<2)return "";
  return '<button class="row" data-act="trocar-eu-vol" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)">'+
    '<span class="ini sm">'+ini(p.nome)+'</span>'+
    '<span class="main"><strong style="font-size:13.5px">'+esc(p.nome)+'</strong><small>simulando este voluntário</small></span>'+
    '<span class="pill mut">trocar</span></button>';
}
function turnosMeus(p){
  var out=[];
  DB.turnos.forEach(function(t){
    var e=by(DB.escalas,t.escalaId);
    if(e&&e.status==="publicada"&&conf(t.id).indexOf(p.id)>=0)out.push(t);
  });
  return out.sort(function(a,b){return dia(a.data).ord-dia(b.data).ord;});
}
function volInicio(){
  var p=euVol(); if(!p)return semVolBox();
  var abertas=escalasAbertasDe(p),e=abertas[0],meus=turnosMeus(p);
  var h=trocaVol(p)+'<div class="greet"><h2>Olá, '+esc(p.nome.split(" ")[0])+'</h2><p>'+
    esc(p.minIds.map(function(m){var x=by(DB.ministerios,m);return x?x.nome:"";}).filter(Boolean).join(" · ")||"sem ministério")+'</p></div>';
  var av=avisosDe(p.id);
  if(av.length){
    h+='<div class="eyebrow"><span>Avisos</span><button data-act="limpar-avisos">Marcar como lidos</button></div>';
    h+='<div class="card list">';
    av.slice().reverse().forEach(function(a){
      h+='<div class="row"><span class="rail" style="background:var(--brand)"></span>'+
        '<div class="main"><strong style="font-weight:500;font-size:13.5px">'+esc(a.txt)+'</strong></div></div>';
    });
    h+='</div>';
  }
  if(e){
    var ts=[],jaMarcou=0;
    abertas.forEach(function(x){
      var tt=turnosDa(x.id);
      tt=p.postoIds.length?tt.filter(function(t){return p.postoIds.indexOf(t.postoId)>=0||!postosDo(x.minId).some(function(o){return p.postoIds.indexOf(o.id)>=0;});}):tt;
      ts=ts.concat(tt);
    });
    ts.forEach(function(t){if(disp(t.id).indexOf(p.id)>=0)jaMarcou++;});
    if(jaMarcou){
      h+='<div class="alert ok">'+svg("check",18)+'<div><b>Disponibilidade enviada</b>Você marcou '+jaMarcou+' turno(s). Dá para mudar até o prazo.</div></div>'+
        '<button class="btn soft wide" data-act="ir-aberta">Rever o que marquei</button>';
    }else{
      h+='<article class="card callout"><div class="top">'+
        '<div class="when">'+esc(fmtMes(e.mes))+(abertas.length>1?' e mais '+(abertas.length-1):'')+' · aberta</div>'+
        '<h3>O líder precisa da sua disponibilidade</h3>'+
        '<p>'+ts.length+' turno(s) abertos. Marque onde você pode servir.</p></div>'+
        '<div class="body"><dl class="kv">'+
        '<dt>Prazo</dt><dd><b>'+(e.prazo?esc(fmtData(e.prazo)):"sem prazo definido")+'</b></dd></dl>'+
        '<div class="actions"><button class="btn primary wide" data-act="ir-aberta">Marcar minha disponibilidade</button></div>'+
        '</div></article>';
    }
  }else{
    h+=vazioBox("cal","Nenhuma escala aberta",
      "Quando o líder liberar a escala do mês, o aviso aparece aqui e você marca onde pode servir.");
  }
  if(meus.length){
    h+='<div class="eyebrow"><span>Meus próximos turnos</span><button data-act="ir-meus">Ver calendário</button></div>';
    h+='<div class="card list">';
    meus.slice(0,3).forEach(function(t){
      var d=dia(t.data),po=by(DB.postos,t.postoId);
      h+='<div class="row"><span class="rail" style="background:var(--ok)"></span>'+
        '<div class="date"><span>'+d.sem+'</span><b>'+d.n+'</b></div>'+
        '<div class="main"><strong>'+(nomeCulto(t)?esc(nomeCulto(t)):(po?esc(po.nome):"turno"))+'</strong>'+
        '<small>'+esc(t.ini)+' às '+esc(t.fim)+(po?' · '+esc(po.nome):'')+'</small></div>'+
        (rotuloFuncs(t.id,p.id)?'<span class="pill brand"><i></i>'+esc(rotuloFuncs(t.id,p.id))+'</span>'
          :'<span class="pill ok"><i></i>Confirmado</span>')+'</div>';
    });
    h+='</div>';
  }
  if(DB.cfg.orientacoes)
    h+='<details class="card"><summary>Orientações do ministério</summary><div class="orient">'+esc(DB.cfg.orientacoes)+'</div></details>';
  return h;
}
function volSemEscala(p){
  if(!p.minIds.length)
    return vazioBox("users","Você não serve em nenhum ministério",
      "Um líder precisa incluir você na equipe dele. Enquanto isso, nenhum turno chega até aqui.",
      '<button class="btn primary" data-act="ir-equipe">Abrir o perfil Líder</button>');
  var todas=[];p.minIds.forEach(function(mid){todas=todas.concat(escalasDo(mid));});
  var rasc=todas.filter(function(x){return x.status==="rascunho";});
  var pub=todas.filter(function(x){return x.status==="publicada";});
  if(rasc.length)
    return vazioBox("cal","A escala ainda é rascunho",
      "Os turnos de <b>"+esc(fmtMes(rasc[0].mes))+"</b> já existem, mas o líder não liberou. No perfil Líder: Escalas › Montar › <b>Liberar para a equipe marcar</b>.",
      '<button class="btn primary" data-act="ir-escalas">Abrir o perfil Líder</button>');
  if(pub.length)
    return vazioBox("check","Escala já publicada",
      "A escala de "+esc(fmtMes(pub[0].mes))+" foi fechada. Os turnos em que você ficou estão em Minha escala.",
      '<button class="btn primary" data-act="ir-meus">Ver minha escala</button>');
  return vazioBox("cal","Nenhuma escala criada ainda",
    "No perfil Líder, aba Escalas, abra a escala do mês e adicione os turnos.",
    '<button class="btn primary" data-act="ir-escalas">Abrir o perfil Líder</button>');
}
function avisoConflito(p,t){
  var cf=choquesDe(p.id,t);
  if(cf.length)
    return '<div style="margin-top:6px;font-size:11.5px;color:var(--crit);font-weight:600;line-height:1.35">'+
      '⚠ Choca com '+esc(descreveTurno(cf[0]))+'</div>';
  var md=mesmoDiaDe(p.id,t);
  if(md.length)
    return '<div style="margin-top:6px;font-size:11.5px;color:var(--warn);line-height:1.35">'+
      'Mesmo dia de '+esc(descreveTurno(md[0]))+'</div>';
  return "";
}
function blocoTurnos(po,ts,p,fora){
  var meus=ts.filter(function(t){return t.postoId===po.id;});
  if(!meus.length)return "";
  return '<section class="posto"><header><span class="t"><strong>'+esc(po.nome)+'</strong>'+
    (po.desc?'<small>'+esc(po.desc)+'</small>':'')+'</span>'+
    (fora?'<span class="pill mut">fora do seu perfil</span>':'')+'</header>'+
    meus.map(function(t){
      var d=dia(t.data),on=disp(t.id).indexOf(p.id)>=0;
      var restam=t.vagas-conf(t.id).length;
      var cf=choquesDe(p.id,t).length>0;
      return '<button class="turno" data-act="marcar" data-id="'+t.id+'" aria-pressed="'+on+'">'+
        '<span class="box">'+svg("check",14)+'</span>'+
        '<span class="t"><strong>'+d.n+' de '+d.mes+' · '+d.sem+(nomeCulto(t)?' · '+esc(nomeCulto(t)):'')+'</strong>'+
        '<small>'+esc(t.ini)+' às '+esc(t.fim)+'</small>'+
        avisoConflito(p,t)+'</span>'+
        (cf?'<span class="pill crit" style="align-self:flex-start"><i></i>Choca</span>'
           :'<span class="vagas"><b>'+(restam>0?restam:0)+'</b>'+(restam===1?"vaga":"vagas")+'</span>')+
        '</button>';
    }).join("")+'</section>';
}
function escalasAbertasDe(p){
  var out=[];
  p.minIds.forEach(function(mid){
    escalasDo(mid).forEach(function(x){if(x.status==="aberta")out.push(x);});
  });
  return out;
}
function volAberta(){
  var p=euVol(); if(!p)return semVolBox();
  var abertas=escalasAbertasDe(p);
  var h='<div class="greet"><h2>Disponibilidade</h2>'+
    '<p>Marque <b>todos</b> os turnos em que você pode servir. Marcar não é estar escalado — o líder confirma depois.</p></div>';
  if(!abertas.length)return h+volSemEscala(p);
  var total=0,comConflito=0;
  abertas.forEach(function(e){
    var m=by(DB.ministerios,e.minId);
    var ts=turnosDa(e.id);
    h+='<div class="eyebrow"><span>'+esc(m?m.nome:"")+' · '+esc(rotuloEscala(e))+'</span>'+
      (e.prazo?'<span style="font-family:var(--ui);text-transform:none;letter-spacing:0;font-size:12px">até '+esc(fmtData(e.prazo))+'</span>':'')+'</div>';
    if(!ts.length){
      h+='<div class="card"><div class="empty"><b>Sem turnos</b><p>O líder liberou a escala mas ainda não adicionou turnos.</p></div></div>';
      return;
    }
    var pos=postosDo(e.minId);
    var meus=pos.filter(function(o){return p.postoIds.indexOf(o.id)>=0;});
    var outros=pos.filter(function(o){return p.postoIds.indexOf(o.id)<0;});
    if(!meus.length){
      h+='<div class="alert warn">'+svg("user",18)+'<div><b>Você não está marcado em nenhum posto aqui</b>'+
        'Por isso está vendo todos os turnos deste ministério. O líder ajusta em Equipe.</div></div>';
      pos.forEach(function(po){h+=blocoTurnos(po,ts,p,false);});
    }else{
      meus.forEach(function(po){h+=blocoTurnos(po,ts,p,false);});
      var extra=outros.map(function(po){return blocoTurnos(po,ts,p,true);}).join("");
      if(extra)h+=extra;
    }
    ts.forEach(function(t){
      if(disp(t.id).indexOf(p.id)>=0){total++;if(choquesDe(p.id,t).length)comConflito++;}
    });
  });
  if(DB.cfg.orientacoes)
    h+='<details class="card"><summary>Orientações do ministério</summary><div class="orient">'+esc(DB.cfg.orientacoes)+'</div></details>';
  if(abertas.length>1)
    h+='<div class="alert info">'+svg("swap",18)+'<div><b>Você tem '+abertas.length+' escalas abertas</b>'+
      'Os turnos de todas aparecem aqui. Quando um choca com o outro, o app marca em vermelho.</div></div>';
  h+='<div class="sticky"><div class="lbl"><span id="cont">'+
    (total?total+" turno(s) marcado(s)":"Nenhum turno marcado ainda")+'</span>'+
    (comConflito?'<span style="color:var(--crit);font-weight:600">'+comConflito+' com choque</span>':'')+'</div>'+
    '<button class="btn primary wide" data-act="enviar-disp" data-id="todas">Enviar disponibilidade</button></div>';
  return h;
}
function agendaDe(p){
  var conf_=[],aguard=[];
  DB.turnos.forEach(function(t){
    var e=by(DB.escalas,t.escalaId); if(!e)return;
    if(e.status==="publicada"){ if(conf(t.id).indexOf(p.id)>=0)conf_.push(t); }
    else if(disp(t.id).indexOf(p.id)>=0)aguard.push(t);
  });
  var ord=function(a,b){return dia(a.data).ord-dia(b.data).ord;};
  return {conf:conf_.sort(ord),aguard:aguard.sort(ord)};
}
function linhaTurno(t,estado){
  var d=dia(t.data),po=by(DB.postos,t.postoId),e=by(DB.escalas,t.escalaId);
  var rf=estado==="conf"?rotuloFuncs(t.id,DB.eu.voluntario):"";
  return '<div class="row" style="align-items:flex-start">'+
    '<span class="rail" style="background:'+(estado==="conf"?"var(--ok)":"var(--warn)")+'"></span>'+
    '<div class="date"><span>'+d.sem+'</span><b>'+d.n+'</b></div>'+
    '<div class="main"><strong>'+(nomeCulto(t)?esc(nomeCulto(t)):(po?esc(po.nome):"turno"))+'</strong>'+
    '<small>'+esc(t.ini)+' às '+esc(t.fim)+(nomeCulto(t)&&po?' · '+esc(po.nome):'')+(t.bandaId?' · '+esc(nomeBanda(t.bandaId)):'')+'</small>'+
    (rf?'<div style="margin-top:7px"><span class="pill brand"><i></i>'+esc(rf)+'</span></div>'
       :(estado==="conf"?'<div style="margin-top:7px"><span class="pill mut">função a definir</span></div>':''))+
    (estado==="conf"
      ? (trocaDo(t.id,DB.eu.voluntario)
          ? '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
            '<span class="pill crit"><i></i>Substituição pedida</span>'+
            '<button class="btn sm ghost" data-act="cancelar-troca" data-id="'+t.id+'">Cancelar pedido</button></div>'
          : '<button class="btn sm ghost" style="margin-top:9px" data-act="pedir-troca" data-id="'+t.id+'">Não vou poder</button>')
      : '<div style="margin-top:8px"><span class="pill warn"><i></i>Aguardando o líder confirmar</span></div>')+
    '</div></div>';
}
function volMeus(){
  var p=euVol(); if(!p)return semVolBox();
  var ag=agendaDe(p);
  var hj=iso(hoje());
  var porDia={};
  ag.conf.forEach(function(t){ (porDia[t.data]=porDia[t.data]||{c:[],a:[]}).c.push(t); });
  ag.aguard.forEach(function(t){ (porDia[t.data]=porDia[t.data]||{c:[],a:[]}).a.push(t); });
  if(!S.mesCal){
    var prox=ag.conf.filter(function(t){return t.data>=hj;})[0]||ag.conf[0]||ag.aguard[0];
    S.mesCal=prox?ymDe(prox.data):ymDe(hj);
  }
  var g=grade(S.mesCal);
  var h='<div class="greet"><h2>Minha escala</h2><p>'+
    (ag.conf.length?ag.conf.length+' turno(s) confirmado(s)':'Nenhum turno confirmado ainda')+
    (ag.aguard.length?' · '+ag.aguard.length+' aguardando':'')+'</p></div>';

  h+='<section class="card cal">';
  h+='<div class="hd"><b>'+esc(fmtMes(S.mesCal))+'</b><span class="nav">'+
    '<button data-act="mes-cal" data-k="-1" aria-label="Mês anterior">'+svg("back",17)+'</button>'+
    '<button data-act="mes-cal" data-k="1" aria-label="Próximo mês">'+svg("fwd",17)+'</button></span></div>';
  h+='<div class="wk">'+["D","S","T","Q","Q","S","S"].map(function(d){return "<span>"+d+"</span>";}).join("")+'</div>';
  h+='<div class="gd">';
  for(var i=0;i<g.start;i++)h+='<span class="dcell vazio"></span>';
  for(var d=1;d<=g.n;d++){
    var iso_=isoYMD(g.y,g.mo,d),info=porDia[iso_];
    var chq_=info&&info.c.length>1&&choca(info.c[0],info.c[1]);
    var cls="dcell"+(iso_===hj?" hoje":"")+(info&&info.c.length?" conf":(info&&info.a.length?" aguard":""))+(chq_?" choque":"");
    h+='<button class="'+cls+'" data-act="dia-cal" data-d="'+iso_+'" aria-pressed="'+(S.diaSel===iso_)+'"'+
       (info?'':' aria-disabled="true"')+'>'+d+
       (info?'<span class="dot"></span>':'')+'</button>';
  }
  h+='</div>';
  h+='<div class="legenda">'+
    '<span><i class="c"></i>Você serve</span>'+
    '<span><i></i>Marcou, aguardando</span>'+
    '<span><i class="h"></i>Hoje</span>'+
    (ag.conf.some(function(t){return conflitosDe(p.id,t).length;})?'<span><i class="x"></i>Choque</span>':'')+'</div>';
  h+='</section>';

  var doMes=[];
  ag.conf.forEach(function(t){if(ymDe(t.data)===S.mesCal)doMes.push({t:t,e:"conf"});});
  ag.aguard.forEach(function(t){if(ymDe(t.data)===S.mesCal)doMes.push({t:t,e:"ag"});});
  doMes.sort(function(x,y){return dia(x.t.data).ord-dia(y.t.data).ord;});
  var lista=S.diaSel?doMes.filter(function(o){return o.t.data===S.diaSel;}):doMes;

  if(S.diaSel){
    h+='<div class="eyebrow"><span>'+esc(fmtData(S.diaSel))+'</span><button data-act="limpar-dia">Ver o mês</button></div>';
  }else{
    h+='<div class="eyebrow"><span>Turnos de '+esc(fmtMes(S.mesCal))+'</span></div>';
  }
  if(!lista.length){
    h+='<div class="card"><div class="empty"><b>'+(S.diaSel?"Nada neste dia":"Nada neste mês")+'</b>'+
      '<p>'+(ag.conf.length||ag.aguard.length?"Use as setas para ver outro mês.":"Quando o líder publicar a escala, os seus turnos aparecem aqui e no calendário.")+'</p></div></div>';
  }else{
    h+='<div class="card list">'+lista.map(function(o){return linhaTurno(o.t,o.e);}).join("")+'</div>';
  }
  var chqs=ag.conf.filter(function(t){return conflitosDe(p.id,t).length&&ymDe(t.data)===S.mesCal;});
  if(chqs.length){
    h+='<div class="alert crit">'+svg("swap",18)+'<div><b>Choque de escala em '+dia(chqs[0].data).n+' de '+dia(chqs[0].data).mes+'</b>'+
      esc(descreveTurno(chqs[0]))+' e '+esc(descreveTurno(conflitosDe(p.id,chqs[0])[0]))+
      '. Avise um dos líderes ou peça substituição.</div></div>';
  }
  if(ag.aguard.length&&!S.diaSel)
    h+='<div class="alert info">'+svg("cal",18)+'<div><b>Aguardando não é escala</b>Os dias em cinza são os que você marcou. Eles só viram compromisso quando o líder publicar.</div></div>';
  return h;
}
function volPerfil(){
  var p=euVol(); if(!p)return semVolBox();
  var mins=serveEm(p).map(function(m){return m.nome;});
  var postos=p.postoIds.map(function(x){var o=by(DB.postos,x);if(!o)return "";var mm=by(DB.ministerios,o.minId);return (mm?mm.nome+" · ":"")+o.nome;}).filter(Boolean);
  var lid=lideraDe(p.id);
  var h='<div class="greet"><h2>Meu perfil</h2><p>Quem cadastrou você foi o líder do ministério</p></div>';

    '<span class="ini" style="width:52px;height:52px;font-size:17px">'+ini(p.nome)+'</span>'+
    '<div style="min-width:0"><strong style="font-size:16px">'+esc(p.nome)+'</strong>'+
    '<div style="color:var(--ink-3);font-size:13px">'+esc(mins.join(" · ")||"sem ministério")+'</div></div></article>';
  h+='<div class="card list">'+
    '<div class="row"><div class="main"><strong>Celular</strong><small>Usado para os avisos</small></div><span class="pill mut">'+esc(p.tel||"—")+'</span></div>'+
    (lid.length?'<div class="row"><div class="main"><strong>Lidero</strong><small>'+esc(lid.map(function(m){return m.nome;}).join(" · "))+'</small></div><span class="pill brand"><i></i>'+lid.length+'</span></div>':'')+
    '<div class="row"><div class="main"><strong>Sirvo em</strong><small>'+(mins.length?esc(mins.join(" · ")):"nenhum")+'</small></div><span class="pill mut">'+mins.length+'</span></div>'+
    '<div class="row"><div class="main"><strong>Postos que atendo</strong><small>'+(postos.length?esc(postos.join(" · ")):"nenhum marcado")+'</small></div><span class="pill mut">'+postos.length+'</span></div>'+
    '</div>';
  var meusChq=turnosFirmes(p.id).filter(function(t){return conflitosDe(p.id,t).length;});
  if(meusChq.length)
    h+='<div class="alert crit">'+svg("swap",18)+'<div><b>'+meusChq.length+' choque(s) de horário</b>'+
      'Você está escalado em dois lugares ao mesmo tempo. Veja em Minha escala.</div></div>';
  h+='<div class="alert info">'+svg("user",18)+'<div><b>Quem muda isso é o líder</b>Se você passou a servir em outro posto, fale com ele — assim a escala continua batendo com a realidade.</div></div>';
  return h;
}

function planoGeracao(){
  var box=document.getElementById("ger"); if(!box)return [];
  var e=by(DB.escalas,box.dataset.esc); if(!e)return [];
  var cs=[],ps=[];
  box.querySelectorAll('[data-act="chip-ger"][aria-pressed="true"]').forEach(function(el){
    if(el.dataset.c)cs.push(el.dataset.c); else if(el.dataset.p)ps.push(el.dataset.p);
  });
  var out=[],existentes=turnosDa(e.id);
  cs.forEach(function(cid){
    var c=by(DB.cultos,cid); if(!c)return;
    ocorrencias(c,e.mes).forEach(function(d){
      ps.forEach(function(pid){
        var po=by(DB.postos,pid); if(!po)return;
        var jaTem=existentes.some(function(t){return t.postoId===pid&&t.data===d&&t.ini===c.ini;})||
                  out.some(function(t){return t.postoId===pid&&t.data===d&&t.ini===c.ini;});
        if(jaTem)return;
        out.push({id:uid(),escalaId:e.id,postoId:pid,data:d,ini:c.ini,fim:c.fim,
                  vagas:po.vagas,cultoId:c.id,cultoNome:c.nome});
      });
    });
  });
  return out.sort(function(a,b){return dia(a.data).ord-dia(b.data).ord;});
}

function proximoMes(){
  var d=hoje();d.setDate(1);d.setMonth(d.getMonth()+1);

}
function opcoesMes(){
  var out=[],d=hoje();d.setDate(1);
  for(var i=0;i<8;i++){
    var ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    out.push({v:ym,l:fmtMes(ym)});
    d.setMonth(d.getMonth()+1);
  }
  return out;
}

/* ============ ações ============ */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-persona],[data-tab],[data-act]");
  if(!t)return;
  if(t.dataset.persona){S.persona=t.dataset.persona;S.view=null;S.diaSel=null;S.mesCal=null;closeSheet();render();return;}
  if(t.dataset.tab){S.tab[S.persona]=t.dataset.tab;S.view=null;S.diaSel=null;S.mesCal=null;closeSheet();render();return;}
  var a=t.dataset.act,id=t.dataset.id,m,p,e,x;

  switch(a){
  case "fechar": closeSheet(); break;
  case "voltar": S.view=null; render(); break;
  case "ir-adm": irPara("adm","minis"); break;
  case "ir-pessoas": irPara("adm","pessoas"); break;
  case "ir-postos": irPara("lider","postos"); break;
  case "ir-equipe": irPara("lider","equipe"); break;
  case "ir-escalas": irPara("lider","escalas"); break;
  case "mes-cal": S.mesCal=shiftMes(S.mesCal,+t.dataset.k); S.diaSel=null; render(true); break;
  case "dia-cal":
    S.diaSel=(S.diaSel===t.dataset.d)?null:t.dataset.d;
    S.mesCal=ymDe(t.dataset.d); render(true); break;
  case "limpar-dia": S.diaSel=null; render(true); break;
  case "ir-aberta": irPara("voluntario","aberta"); break;
  case "ir-meus": irPara("voluntario","meus"); break;
  case "bar": S.barSel=+t.dataset.i; render(true); break;

  /* ---- ministérios ---- */
  case "nova-funcao":
    m=meuMin();
    openSheet("Criar função","Ex.: câmera, mesa de som, fotografia, caixa da cantina.",
      '<div class="form">'+campo("f-fn-nome","Nome da função","Ex.: mesa de som")+'</div>',
      '<button class="btn primary wide" data-act="salvar-funcao">Criar</button>');
    break;
  case "salvar-funcao":
    m=meuMin(); var fn=v("f-fn-nome"); if(!fn){toast("Escreva o nome da função.");return;}
    DB.funcoes.push({id:uid(),minId:m.id,nome:fn}); save(); closeSheet();
    toast("Função criada. Agora é só reaproveitar."); render(true); break;
  case "func-editar":
    x=by(DB.funcoes,id);
    openSheet("Editar função","Renomear vale para todas as escalas, inclusive as antigas.",
      '<div class="form">'+campo("f-fn-nome","Nome da função","",x.nome)+'</div>',
      '<div style="display:flex;gap:9px"><button class="btn danger" data-act="excluir-funcao" data-id="'+id+'">Excluir</button>'+
      '<button class="btn primary" data-act="renomear-funcao" data-id="'+id+'">Salvar</button></div>');
    break;

    }catch(err){toast("Esse texto não é um backup válido.");}
    break;
  case "apagar-tudo":
    openSheet("Apagar todos os dados","Ministérios, postos, escalas, turnos e pessoas. A grade de cultos é recriada.",
      '<div style="padding:0 18px 12px"><div class="alert crit" style="margin:0">'+svg("trash",18)+
      '<div><b>Não dá para desfazer</b>Se quiser guardar antes, cancele e use Exportar. Os '+GRADE_PADRAO.length+' cultos voltam automaticamente para a próxima bateria de teste.</div></div></div>',
      '<div style="display:flex;gap:9px"><button class="btn ghost" data-act="fechar">Cancelar</button>'+
      '<button class="btn danger" data-act="apagar-ok">Apagar tudo</button></div>');
    break;
  case "apagar-ok":
    DB=novoDB(); save(); closeSheet(); S.view=null; S.persona="adm"; S.tab.adm="minis";
    toast("Tudo apagado. A grade de cultos voltou."); render(); break;
  case "restaurar-exemplo":
    openSheet("Restaurar dados de exemplo","Os dados atuais serão substituídos pelo exemplo de teste.",
      '<div style="padding:0 18px 12px"><div class="alert warn" style="margin:0">'+svg("swap",18)+
      '<div><b>Os dados atuais serão perdidos</b>Se quiser guardar, cancele e use Exportar antes.</div></div></div>',
      '<div style="display:flex;gap:9px"><button class="btn ghost" data-act="fechar">Cancelar</button>'+
      '<button class="btn primary" data-act="restaurar-exemplo-ok">Restaurar</button></div>');
    break;
  case "restaurar-exemplo-ok":
    DB=dadosExemplo(); save(); closeSheet(); S.view=null; S.persona="adm"; S.tab.adm="minis";
    toast("Dados de exemplo restaurados."); render(); break;
  }
});

load(); render();
})();
</script>

</body>
</html>
